# Initial technical values; tune after baseline experiments.
# Key names follow docs/solution_design.md, section 15.
project:
  name: area-violation-detection

camera:
  camera_id: CAM_001

detector:
  backend: ultralytics
  model: yolo11n
  weights: weights/yolo11n.pt
  input_size: 640
  device: cpu
  confidence_threshold: 0.4
  nms_threshold: 0.45
  detection_classes:
    - person
    - motorcycle
    - car
    - bicycle
    - bus
    - truck

tracking:
  backend: bytetrack
  track_thresh: 0.5
  # Buffer in frames at 30 FPS; ByteTrack scales it to the input FPS.
  track_buffer: 30
  match_thresh: 0.8

zones:
  path: configs/zones/cam_001.json
  # A track is inside a zone when this fraction of its bounding box overlaps it.
  bbox_overlap_threshold: 0.2
  # Web demo automatic suggestion for stable painted/hatched regions.
  auto_detect:
    backend: classical
    num_frames: 15
    vote_ratio: 0.6
    min_area_ratio: 0.005
    simplify_epsilon_ratio: 0.015

violation:
  event_type: SUSPECTED_AREA_OCCUPATION
  target_classes:
    - motorcycle
    - car
    - bicycle
    - bus
    - truck
  # Consecutive tracked frames whose bounding box sufficiently overlaps the target ROI.
  min_inside_frames: 10
  exit_grace_sec: 3

dedup:
  cooldown_sec: 60
  spatial_distance_px: 50

storage:
  sqlite_path: data/events/events.db
  snapshot_dir: data/events/snapshots
